name: pamati-ai
services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pamati}
      MYSQL_USER: ${MYSQL_USER:-pamati}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [data]
  migrate:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: &backend_env
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-pamati}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-pamati}?charset=utf8mb4
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PUBLIC_REGISTRATION_ENABLED: ${PUBLIC_REGISTRATION_ENABLED:-false}
      INSTITUTIONAL_DOMAINS: ${INSTITUTIONAL_DOMAINS:-[]}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      AUTH_DELIVERY_KEY: ${AUTH_DELIVERY_KEY:-}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALLOW_RAW_MEDIA_STORAGE: ${ALLOW_RAW_MEDIA_STORAGE:-false}
      TEXT_ANALYSIS_MODELS: '${TEXT_ANALYSIS_MODELS:-[]}'
      TEXT_ANALYSIS_MINIMUM_CONFIDENCE: ${TEXT_ANALYSIS_MINIMUM_CONFIDENCE:-0.0}
      AUDIO_ANALYSIS_ENABLED: ${AUDIO_ANALYSIS_ENABLED:-false}
      AUDIO_ANALYSIS_MODEL: ${AUDIO_ANALYSIS_MODEL:-acoustic-features}
      AUDIO_ANALYSIS_MINIMUM_CONFIDENCE: ${AUDIO_ANALYSIS_MINIMUM_CONFIDENCE:-0.0}
      AUDIO_MAX_BYTES: ${AUDIO_MAX_BYTES:-3000000}
      AUDIO_MAX_SECONDS: ${AUDIO_MAX_SECONDS:-30.0}
      AUDIO_TEMPORARY_DIRECTORY: /tmp/pamati-audio
      AUDIO_STORAGE_DIRECTORY: /workspace/private-audio
      CORS_ORIGINS: '["http://localhost:3000"]'
      ALLOWED_HOSTS: '["localhost","127.0.0.1","backend"]'
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend_env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - ./backend/app:/workspace/backend/app:ro
      - audio_recordings:/workspace/private-audio
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [web, data]
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      API_INTERNAL_URL: http://backend:8000
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost:3000}
      NEXT_TELEMETRY_DISABLED: '1'
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks: [web]
volumes:
  mysql_data:
  audio_recordings:
networks:
  web:
  data:
    internal: true
