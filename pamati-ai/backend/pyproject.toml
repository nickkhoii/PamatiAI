[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pamati-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "SQLAlchemy>=2.0,<2.1", "PyMySQL[rsa]>=1.1,<2", "alembic>=1.14,<2", "argon2-cffi>=23.1,<26", "cryptography>=44,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]
ml = ["transformers>=4.48,<5", "torch>=2.6,<3", "scikit-learn>=1.6,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["../tests/backend"]

[tool.ruff]
target-version = "py312"
line-length = 100
