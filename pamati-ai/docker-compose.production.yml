# Apply after docker-compose.yml. Requires an institutional HTTPS reverse proxy.
services:
  migrate:
    environment:
      ENVIRONMENT: production
  seed:
    environment:
      ENVIRONMENT: production
  development-accounts:
    environment:
      ENVIRONMENT: production
  auth-mail:
    environment:
      ENVIRONMENT: production
  purge-audio:
    environment:
      ENVIRONMENT: production
  backend:
    environment:
      ENVIRONMENT: production
    command: ["uvicorn", "app.main:app", "--no-access-log", "--host", "0.0.0.0", "--port", "8000"]
    volumes: !override
      - audio_recordings:/workspace/private-audio
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.production.Dockerfile
    environment:
      NODE_ENV: production
    volumes: !reset []
    restart: unless-stopped
  db:
    restart: unless-stopped
